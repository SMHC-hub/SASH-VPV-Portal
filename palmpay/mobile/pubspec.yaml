name: palmpay
description: Palm vein biometric wallet — VeinPay mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  pinput: ^5.0.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.5
  local_auth: ^2.3.0
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/VeinPay-Light.png
    - assets/branding/VeinPay-Dark.png
