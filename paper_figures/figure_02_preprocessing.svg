<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="400" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Fig. 2. Data Preprocessing Pipeline</text>
<rect x="55" y="60" width="155" height="48" rx="4" fill="#F8F8F8" stroke="#1A1A1A" stroke-width="1.2"/>
<text x="132" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">Grayscale Input</text>
<text x="132" y="92" text-anchor="middle" font-size="8" fill="#4A4A4A">PNG or 480×640 raw</text>
<line x1="210" y1="84" x2="228" y2="84" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
