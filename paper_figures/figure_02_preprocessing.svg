<text x="305" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">Otsu + Morphology</text>
<text x="305" y="92" text-anchor="middle" font-size="8" fill="#4A4A4A">hand segmentation</text>
<line x1="383" y1="84" x2="401" y2="84" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="401" y="60" width="155" height="48" rx="4" fill="#F8F8F8" stroke="#1A1A1A" stroke-width="1.2"/>
<text x="478" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">Landmark Detection</text>
